[project]
name = "gmail-mcp"
version = "0.1.0"
description = "Personal Gmail MCP server for inbox cleanup"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2,<2",
    "google-api-python-client>=2.140",
    "google-auth-oauthlib>=1.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[project.scripts]
gmail-mcp = "gmail_mcp.server:main"

[project.optional-dependencies]
web = [
    "anthropic>=0.40",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gmail_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF", # ruff-specific
]

[tool.ruff.format]
quote-style = "double"
